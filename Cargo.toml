[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
examcore = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Used by `dx bundle --web --release`. Must not strip: wasm-bindgen reads its data from
# custom sections of the .wasm file.
[profile.wasm-release]
inherits = "release"
strip = false
opt-level = "s"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
