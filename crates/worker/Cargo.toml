[package]
name = "explainer"
version.workspace = true
edition.workspace = true
description = "Generates Claude explanations for queued questions using Claude Code (Claude subscription)."

[dependencies]
examcore.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
